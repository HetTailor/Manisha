<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANISHA GRAPHIX — Creative Design. Professional Printing. Quality Results.</title>
    <meta name="description" content="Manisha Graphix. Professional graphic design and printing solutions for businesses, wedding cards, pharmaceutical packaging, and book work." />
    <meta property="og:title" content="MANISHA GRAPHIX — Creative Design & Professional Printing" />
    <meta property="og:description" content="Creative graphic design and professional printing solutions crafted with precision, quality, and attention to detail." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/assets/manisha-graphix-header-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('manisha-graphix-color-mode');
          var mode = saved === 'dark' || saved === 'light' ? saved : 'light';
          document.documentElement.setAttribute('data-color-mode', mode);
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(mode);
        } catch (e) {
          document.documentElement.setAttribute('data-color-mode', 'light');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
